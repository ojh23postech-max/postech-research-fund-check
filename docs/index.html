<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구비 집행 점검 | POSTECH</title>
<meta name="description" content="국가R&D·산업부·POSTECH 규정으로 연구비 집행 적정성을 점검하고 관련 사례와 협약변경 필요 여부를 확인합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>연구비 집행 점검</h1>
  <p class="meta" id="meta">규정 불러오는 중</p>
  <p class="notice">참고용 안내입니다. 최종 판단은 연구지원팀과 전문기관 기준을 따르세요.</p>
</header>

<main class="board">
  <!-- 입력 -->
  <form class="panel input" id="form" autocomplete="off">
    <h2 class="sr">집행 정보 입력</h2>
    <p class="step">과제 정보</p>
    <label class="field">소관 부처 (전문기관)
      <select id="track"></select>
    </label>
    <p class="step">무엇을 집행하나요?</p>
    <label class="field">집행 항목
      <select id="itemSel"><option value="">목록에서 고르세요</option></select>
    </label>
    <label class="field">또는 키워드로 찾기
      <input id="item" type="search" placeholder="예: 노트북, 해외출장, 자문료">
    </label>
    <div class="row">
      <label class="field">금액(원)<input id="amount" inputmode="numeric" autocomplete="off" placeholder="예: 300,000"></label>
      <label class="field">인원<input id="people" type="number" min="1" inputmode="numeric"></label>
    </div>
    <div class="row">
      <label class="field">집행일<span class="dt"><input id="spend" class="date" inputmode="numeric" maxlength="10" placeholder="20261009" autocomplete="off"><button type="button" class="cal" aria-label="달력에서 고르기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button><input type="date" class="pick" tabindex="-1" aria-hidden="true"></span></label>
      <label class="field">과제 종료일<span class="dt"><input id="end" class="date" inputmode="numeric" maxlength="10" placeholder="20261009" autocomplete="off"><button type="button" class="cal" aria-label="달력에서 고르기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button><input type="date" class="pick" tabindex="-1" aria-hidden="true"></span></label>
    </div>
    <fieldset class="qs" id="qs"><legend>해당하면 체크</legend></fieldset>
    <fieldset class="agree" id="agreeBox" hidden>
      <legend>이 집행은 협약변경이 필요합니다. 처리 상태는?</legend>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="ag" value="done">완료</label>
        <label><input type="radio" name="ag" value="none" checked>안 함·진행 중</label>
      </div>
      <label class="field" id="agDateWrap" hidden>승인(통보)일<span class="dt"><input id="agDate" class="date" inputmode="numeric" maxlength="10" placeholder="20261009" autocomplete="off"><button type="button" class="cal" aria-label="달력에서 고르기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button><input type="date" class="pick" tabindex="-1" aria-hidden="true"></span></label>
    </fieldset>
  </form>

  <!-- 판정 -->
  <section class="panel result" aria-live="polite" id="result">
    <div class="empty" id="empty">
      <p class="eyebrow">연구비 집행 점검</p>
      <p class="lead">어떤 연구비를 쓰려고 하세요?</p>
      <p>왼쪽에서 항목을 고르면 혁신법·부처 규정·POSTECH 내규로 바로 판정하고, 비슷한 사례와 협약변경 필요 여부도 함께 알려 드려요.</p>
      <ul class="quick" id="quick"></ul>
    </div>
    <div class="verdict" id="verdict" hidden>
      <div class="seal" id="seal"><span id="sealText"></span></div>
      <div class="head">
        <p class="what" id="what"></p>
        <h2 id="vTitle"></h2>
        <div class="cases-hint" id="casesHint"></div>
      </div>
      <ol class="reasons" id="reasons"></ol>
      <div class="split">
        <section class="box">
          <h3>갖출 증빙</h3>
          <ul class="docs" id="evid"></ul>
        </section>
        <section class="box" id="agBox">
          <h3>협약변경</h3>
          <div id="agSummary"></div>
        </section>
      </div>
    </div>
  </section>

  <!-- 근거 -->
  <section class="panel side">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="cases" id="tabCases">사례</button>
      <button role="tab" aria-selected="false" data-tab="regs">적용 규정</button>
      <button role="tab" aria-selected="false" data-tab="agree">협약변경</button>
      <button role="tab" aria-selected="false" data-tab="law">근거 원문</button>
    </div>
    <div class="tabpanel" id="pCases">
      <label class="case-search"><span class="sr">사례 검색</span><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="caseQ" type="search" placeholder="사례에서 찾기 (예: 회의록, 해외 학회, 소급)" autocomplete="off"></label>
      <div class="dist" id="dist"></div>
      <ul class="cards" id="cards"></ul>
      <nav class="pager" id="pager"><button type="button" id="prev" aria-label="이전 사례">‹</button><span id="pageInfo"></span><button type="button" id="next" aria-label="다음 사례">›</button></nav>
    </div>
    <div class="tabpanel" id="pRegs" hidden></div>
    <div class="tabpanel" id="pAgree" hidden></div>
    <div class="tabpanel" id="pLaw" hidden></div>
  </section>
</main>

<dialog id="dlg"><form method="dialog"><button class="x" aria-label="닫기">×</button></form><div id="dlgBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
